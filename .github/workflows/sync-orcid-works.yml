name: Sync ORCID Works

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * 1'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Fetch public Works from ORCID
        env:
          ORCID_CLIENT_ID: ${{ secrets.ORCID_CLIENT_ID }}
          ORCID_CLIENT_SECRET: ${{ secrets.ORCID_CLIENT_SECRET }}
        run: node scripts/sync-orcid-works.mjs
      - name: Commit updated Works list
        run: |
          if git diff --quiet -- data/orcid-works.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/orcid-works.json
          git commit -m "chore: sync ORCID works"
          git push
